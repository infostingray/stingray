<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>stingray — coming soon</title>
<meta name="description" content="stingray is surfacing soon — a performance digital advertising studio for brands that refuse to blend in. Dbayeh, Lebanon." />
<meta name="theme-color" content="#06060a" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="stingray" />
<meta property="og:title" content="stingray — coming soon" />
<meta property="og:description" content="Something that leaves a mark is surfacing soon." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root {
    --bluebonnet: #2423e0;
    --bluebonnet-light: #5d5cff;
    --bluebonnet-deep: #1a19a8;
    --white: #ffffff;
    --bg: #06060a;
    --bg-soft: #0c0c14;
    --muted: rgba(255, 255, 255, 0.52);
    --faint: rgba(255, 255, 255, 0.30);
    --line: rgba(255, 255, 255, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Poppins', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  ::selection { background: var(--bluebonnet); color: var(--white); }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Atmosphere ── */
  .aurora {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .aurora::before,
  .aurora::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.55;
  }
  .aurora::before {
    width: 70vw;
    height: 70vw;
    max-width: 900px;
    max-height: 900px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(36, 35, 224, 0.42), transparent 62%);
  }
  .aurora::after {
    width: 50vw;
    height: 50vw;
    max-width: 620px;
    max-height: 620px;
    right: -10vw;
    bottom: -14vw;
    background: radial-gradient(circle, rgba(93, 92, 255, 0.20), transparent 65%);
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  /* Fine grain for premium texture */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.04;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }

  #stingray-3d {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #stingray-3d.ready { opacity: 1; }

  /* ── Layout ── */
  .topbar,
  .center,
  .footer {
    position: relative;
    z-index: 4;
    width: 100%;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(26px, 4.5vh, 52px) clamp(26px, 5vw, 76px);
  }

  .wordmark {
    font-weight: 700;
    font-size: clamp(18px, 1.5vw, 22px);
    letter-spacing: -0.02em;
    color: var(--white);
    opacity: 0;
  }
  .wordmark .dot { color: var(--bluebonnet-light); }

  .locale {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--faint);
    opacity: 0;
  }

  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    pointer-events: none;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(11px, 1vw, 13px);
    font-weight: 500;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--bluebonnet-light);
    margin-bottom: clamp(20px, 3.4vh, 34px);
    opacity: 0;
  }
  .eyebrow::before,
  .eyebrow::after {
    content: "";
    width: clamp(26px, 4vw, 52px);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--bluebonnet-light));
  }
  .eyebrow::after { background: linear-gradient(90deg, var(--bluebonnet-light), transparent); }

  h1 {
    font-weight: 600;
    font-size: clamp(34px, 6.4vw, 92px);
    line-height: 1.02;
    letter-spacing: -0.03em;
    max-width: 16ch;
  }
  h1 .accent {
    font-weight: 700;
    background: linear-gradient(105deg, var(--white) 10%, var(--bluebonnet-light) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 .w { display: inline-block; opacity: 0; }

  .sub {
    margin-top: clamp(20px, 3.2vh, 32px);
    font-size: clamp(14px, 1.35vw, 19px);
    font-weight: 300;
    line-height: 1.65;
    color: var(--muted);
    max-width: 46ch;
    opacity: 0;
  }

  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding: clamp(24px, 4vh, 48px) clamp(26px, 5vw, 76px);
  }

  .socials {
    display: flex;
    gap: clamp(20px, 3vw, 40px);
    list-style: none;
    pointer-events: auto;
  }
  .socials a {
    position: relative;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    text-decoration: none;
    padding-bottom: 5px;
    transition: color 0.32s ease;
  }
  .socials a::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--bluebonnet-light);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .socials a:hover { color: var(--white); }
  .socials a:hover::after { transform: scaleX(1); }

  .copyline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    text-align: right;
  }
  .copyline span { display: block; }
  .copyline span:last-child { color: rgba(255,255,255,0.22); margin-top: 6px; }

  /* Reveal cascade — fired after the stingray locks in */
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  body.revealed .wordmark   { animation: rise 0.9s 0.05s both; }
  body.revealed .locale     { animation: rise 0.9s 0.12s both; }
  body.revealed .eyebrow    { animation: rise 0.9s 0.20s both; }
  body.revealed h1 .w       { animation: rise 1s both; }
  body.revealed h1 .w:nth-child(1) { animation-delay: 0.30s; }
  body.revealed h1 .w:nth-child(2) { animation-delay: 0.37s; }
  body.revealed h1 .w:nth-child(3) { animation-delay: 0.44s; }
  body.revealed h1 .w:nth-child(4) { animation-delay: 0.51s; }
  body.revealed h1 .w:nth-child(5) { animation-delay: 0.58s; }
  body.revealed .sub        { animation: rise 1s 0.68s both; }
  body.revealed .socials    { animation: rise 0.9s 0.82s both; }
  body.revealed .copyline   { animation: rise 0.9s 0.90s both; }

  @media (max-width: 720px) {
    .footer {
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }
    .copyline { text-align: center; }
    .topbar { padding-left: 22px; padding-right: 22px; }
    h1 { max-width: 14ch; }
  }

  @media (prefers-reduced-motion: reduce) {
    #stingray-3d { transition: none; }
    body.revealed * { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>

    <div class="grain"></div>

  (function init3D() {
    const reveal = () => {
      if (document.body.classList.contains('revealed')) return;
      document.body.classList.add('revealed');

    if (!window.THREE) {
      console.warn('[stingray] Three.js unavailable — revealing immediately');
      reveal();
      return;

    const canvas = document.getElementById('stingray-3d');
    const stageEl = document.querySelector('.stage');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      reveal();
      return;
    }

    const scene  = new THREE.Scene();

    let startPositions = null;
    let assemblyDelays = null;

    scene.add(stingrayGroup);

    let cursorActive = false;
    const cursorVelocity = { x: 0, y: 0 };
    const cursorWorldPrev = { x: 0, y: 0 };
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Camera distance computed by resize() so the silhouette sits
    // centered and prominent with premium breathing room.
    let camZ = 9;

    // ── Intro timeline ──
    let introActive = true;
    const INTRO = {
      assembleAt:  0.5,
      assembleDur: 1.9,
      flashAt:     2.5,
      endAt:       3.4,
    };
    let flashFired = false;
    let endFired = false;

    function endIntro() {
      if (!introActive) return;
      introActive = false;
      reveal();
      resize();
    }

    // Primary timeline driver — runs even in background tabs.
    setTimeout(() => { if (!endFired) { endFired = true; endIntro(); } }, INTRO.endAt * 1000);

    // ── Background plankton field ──
    {
      const N = 620;
      const pos = new Float32Array(N * 3);
      const col = new Float32Array(N * 3);
      const c1 = new THREE.Color(0x2423e0);
      const c2 = new THREE.Color(0x5d5cff);
      const c3 = new THREE.Color(0xffffff);
      for (let i = 0; i < N; i++) {
        pos[i*3]   = (Math.random() - 0.5) * 28;
        pos[i*3+1] = (Math.random() - 0.5) * 17;
        pos[i*3+2] = (Math.random() - 0.5) * 14 - 4;
        const t = Math.random();
        const c = t < 0.6 ? c1 : t < 0.9 ? c2 : c3;
        col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
      const m = new THREE.PointsMaterial({
        size: 0.025, vertexColors: true, transparent: true,
        opacity: 0.5, blending: THREE.AdditiveBlending,
        depthWrite: false, sizeAttenuation: true,

      plankton = new THREE.Points(g, m);
      scene.add(plankton);

    function makeSpriteTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0,   'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.7)');
      grad.addColorStop(0.7, 'rgba(255,255,255,0.15)');
      grad.addColorStop(1,   'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      const t = new THREE.CanvasTexture(c);
      t.minFilter = THREE.LinearFilter;
      t.magFilter = THREE.LinearFilter;
      return t;

      const ctx = off.getContext('2d');
      ctx.drawImage(img, 0, 0, W, H);
      const data = ctx.getImageData(0, 0, W, H).data;

      const STEP = 3;
      const SCALE = 0.012;
      const positions = [], colors = [];

      const cb = new THREE.Color(0x2423e0);
      const cl = new THREE.Color(0x9a99ff);
      const cw = new THREE.Color(0xffffff);

      for (let y = 0; y < H; y += STEP) {
        for (let x = 0; x < W; x += STEP) {
          const i = (y * W + x) * 4;
          const a = data[i+3] / 255;
          if (a < 0.35) continue;
          const r = data[i] / 255, g = data[i+1] / 255, b = data[i+2] / 255;
          const lum = 0.299*r + 0.587*g + 0.114*b;
          const px = (x - W/2) * SCALE;
          const py = -(y - H/2) * SCALE;
          const pz = (lum - 0.4) * 1.6 + (Math.random() - 0.5) * 0.18;
          positions.push(px, py, pz);
          let c;
          if (lum < 0.35)      c = cb.clone().lerp(cl, lum / 0.35);
          else if (lum < 0.7)  c = cl.clone().lerp(cw, (lum - 0.35) / 0.35);
          else                 c = cw;
          colors.push(c.r, c.g, c.b);
        }
      }

      const geo = new THREE.BufferGeometry();
      basePositions = new Float32Array(positions);
      displacementOffsets = new Float32Array(basePositions.length);

      const N = positions.length / 3;
      startPositions = new Float32Array(N * 3);
      assemblyDelays = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const r = 11 + Math.random() * 7;
        const theta = Math.random() * Math.PI * 2;
        const phi   = Math.acos(Math.random() * 2 - 1);
        startPositions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
        startPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.7;
        startPositions[i*3+2] = -Math.abs(r * Math.cos(phi)) - 4;
        assemblyDelays[i] = Math.random() * 0.55;
      }

      const initial = introActive ? new Float32Array(startPositions) : new Float32Array(positions);
      geo.setAttribute('position', new THREE.BufferAttribute(initial, 3));
      geo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(colors), 3));

      const mat = new THREE.PointsMaterial({
        size: 0.05, vertexColors: true, transparent: true, opacity: 1,
        blending: THREE.AdditiveBlending, depthWrite: false,
        sizeAttenuation: true, map: makeSpriteTexture(), alphaTest: 0.001,
      });

      stingray = new THREE.Points(geo, mat);
      stingray.position.set(0, 0, 0);   // centered for coming-soon composition
      stingrayGroup.add(stingray);

      canvas.classList.add('ready');
      resize();
    };
    img.onerror = (e) => {
      console.warn('[stingray] emblem failed to load — revealing without 3D', e);
      const ms = Math.max(0, INTRO.endAt * 1000 - performance.now());
      setTimeout(() => { if (!endFired) { endFired = true; endIntro(); } }, ms);
    };
    img.src = HERO_IMG;

    // ── Pointer tracking ──
    let tx = 0, ty = 0, mx = 0, my = 0;
    function setPointer(clientX, clientY) {
      const r = stageEl.getBoundingClientRect();
      mx = ((clientX - r.left) / r.width  - 0.5) * 2;
      my = ((clientY - r.top)  / r.height - 0.5) * 2;
      cursorActive = true;
    }
    window.addEventListener('mousemove', (e) => setPointer(e.clientX, e.clientY));
    stageEl.addEventListener('mouseleave', () => { cursorActive = false; });
    stageEl.addEventListener('mouseenter', () => { cursorActive = true; });
    stageEl.addEventListener('touchmove', (e) => {
      if (e.touches.length) setPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    stageEl.addEventListener('touchstart', (e) => {
      if (e.touches.length) setPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    stageEl.addEventListener('touchend', () => { cursorActive = false; });

    // ── Animation loop ──
    const clock = new THREE.Clock();
    let visible = true;
    new IntersectionObserver(
      ([entry]) => { visible = entry.isIntersecting; },
      { threshold: 0 }
    ).observe(stageEl);

    function tick() {
      requestAnimationFrame(tick);
      if (!visible) return;
      const t = clock.getElapsedTime();

      tx += (mx - tx) * 0.05;
      ty += (my - ty) * 0.05;

      const ease = {
        outCubic:  x => 1 - Math.pow(1 - x, 3),
        inOutCubic: x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2,
      };

      if (stingray && basePositions && startPositions) {
        const arr = stingray.geometry.attributes.position.array;
        const N = arr.length / 3;

        if (introActive) {
          // Camera dolly — push in toward the lock moment
          const dollyT = Math.min(t / INTRO.flashAt, 1);
          camera.position.z = (camZ + 2.5) - ease.outCubic(dollyT) * 2.5;
          camera.updateProjectionMatrix();

          const sinceAssemble = t - INTRO.assembleAt;
          if (sinceAssemble < INTRO.assembleDur + 0.6) {
            for (let i = 0; i < N; i++) {
              const pd = assemblyDelays[i];
              const local = (sinceAssemble - pd) / INTRO.assembleDur;
              const e = local <= 0 ? 0 : local >= 1 ? 1 : ease.outCubic(local);
              const j = i * 3;
              arr[j]   = startPositions[j]   + (basePositions[j]   - startPositions[j])   * e;
              arr[j+1] = startPositions[j+1] + (basePositions[j+1] - startPositions[j+1]) * e;
              arr[j+2] = startPositions[j+2] + (basePositions[j+2] - startPositions[j+2]) * e;
            }
          } else {
            const w = t * 1.6;
            for (let i = 0; i < arr.length; i += 3) {
              const bx = basePositions[i];
              const wave = Math.sin(w - bx * 0.7) * 0.18;
              arr[i+1] = basePositions[i+1] + wave * 0.4;
              arr[i+2] = basePositions[i+2] + wave * 0.6;
            }
          }
          stingray.geometry.attributes.position.needsUpdate = true;

          if (!flashFired && t >= INTRO.flashAt) {
            flashFired = true;
            if (!document.body.classList.contains('revealed')) reveal();
          }

          stingrayGroup.rotation.y = Math.sin(t * 0.4) * 0.08 + tx * 0.06;
          stingrayGroup.rotation.x = Math.sin(t * 0.3) * 0.03 - ty * 0.04;

          if (!endFired && t >= INTRO.endAt) { endFired = true; endIntro(); }
        } else {
          // ── Idle — swimming wave + cursor-reactive ripple ──
          const w = t * 1.6;
          const fovRad = THREE.MathUtils.degToRad(45);
          const fovH = 2 * Math.tan(fovRad / 2) * camera.position.z;
          const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
          const fovW = fovH * aspect;
          const cwx = tx * fovW / 2;
          const cwy = -ty * fovH / 2;

          cursorVelocity.x += ((cwx - cursorWorldPrev.x) - cursorVelocity.x) * 0.25;
          cursorVelocity.y += ((cwy - cursorWorldPrev.y) - cursorVelocity.y) * 0.25;
          cursorWorldPrev.x = cwx;
          cursorWorldPrev.y = cwy;

          const decay = 0.92;
          for (let i = 0; i < displacementOffsets.length; i++) displacementOffsets[i] *= decay;

          if (cursorActive && !reduceMotion) {
            const RR = 1.6, RR2 = RR * RR, PUSH = 0.06, CUR = 0.35;
            const sx = stingray.position.x, sy = stingray.position.y;
            for (let i = 0; i < N; i++) {
              const j = i * 3;
              const dx = (basePositions[j] + sx) - cwx;
              const dy = (basePositions[j+1] + sy) - cwy;
              const d2 = dx*dx + dy*dy;
              if (d2 < RR2 && d2 > 0.0001) {
                const dist = Math.sqrt(d2);
                const f = (1 - dist / RR) * (1 - dist / RR);
                const inv = 1 / dist;
                displacementOffsets[j]   += dx * inv * f * PUSH + cursorVelocity.x * f * CUR;
                displacementOffsets[j+1] += dy * inv * f * PUSH + cursorVelocity.y * f * CUR;
                displacementOffsets[j+2] += f * PUSH * 0.4;
              }
            }
          }

          for (let i = 0; i < arr.length; i += 3) {
            const bx = basePositions[i];
            const wave = Math.sin(w - bx * 0.7) * 0.18;
            arr[i]   = basePositions[i]   + displacementOffsets[i];
            arr[i+1] = basePositions[i+1] + wave * 0.4 + displacementOffsets[i+1];
            arr[i+2] = basePositions[i+2] + wave * 0.6 + displacementOffsets[i+2];
          }
          stingray.geometry.attributes.position.needsUpdate = true;

          stingrayGroup.rotation.y = Math.sin(t * 0.35) * 0.16 + tx * 0.24;
          stingrayGroup.rotation.x = Math.sin(t * 0.27) * 0.06 - ty * 0.14;
          stingrayGroup.position.x = tx * 0.16;
          stingrayGroup.position.y = Math.sin(t * 0.6) * 0.10 - ty * 0.16;
        }
      }

      if (plankton) {
        plankton.rotation.y = t * 0.015;
        plankton.rotation.x = Math.sin(t * 0.2) * 0.05;
      }
      renderer.render(scene, camera);
    }
    tick();

    // ── Resize — frame the centered silhouette with premium margin ──
    // Emblem sampled at W=800, SCALE 0.012 → ~9.6 wide × ~2.8 tall.
    // We pick a camera distance so the stingray occupies ~60% of the
    // viewport: prominent, but with the negative space a premium
    // coming-soon page wants. Floor/clamp keeps it sane on extremes.
    function resize() {
      const w = stageEl.clientWidth;
      const h = stageEl.clientHeight;
      renderer.setSize(w, h, false);
      const aspect = w / h;
      camera.aspect = aspect;

      const HALF_W = 5.0;     // ~9.6/2 + slight ripple margin
      const HALF_H = 1.9;     // ~2.8/2 + wave margin
      const FILL   = 0.60;    // target fraction of viewport occupied

      const tanHalf = Math.tan((45 * Math.PI / 180) / 2);
      const dW = (HALF_W / FILL) / (tanHalf * aspect);
      const dH = (HALF_H / FILL) / tanHalf;
      camZ = Math.min(Math.max(dW, dH, 8), 20);

      if (!introActive) camera.position.z = camZ;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
  })();
</script>
</body>
</html>
